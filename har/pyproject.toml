[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "har"
version = "1.0.0"
description = "Hardware-Aware Runtime: @har.offload decorator plus host/worker services that route Python work across CPU, Apple MPS, and NVIDIA CUDA on your personal LAN."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "psutil>=5.9",
    "torch>=2.2",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
desktop = ["pyinstaller>=6.0"]
gpu-metrics = ["nvidia-ml-py>=12.0"]

[project.scripts]
har = "har.runtime.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["har*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
