[package]
name = "har-runtime"
version = "1.1.0"
description = "Hardware-Aware AI Runtime desktop shell"
edition = "2021"

[lib]
name = "har_runtime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
