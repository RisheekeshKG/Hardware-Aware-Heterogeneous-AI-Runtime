name: Release desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The Windows app downloads its runtime on first launch (see the windows-*-runtime jobs).
      - if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os != 'Windows'
        run: python -m pip install -e ".[desktop]"
      - if: runner.os != 'Windows'
        run: ./scripts/build-sidecar.sh
      - if: runner.os != 'Windows'
        run: tar -czf web/src-tauri/runtime/har-runtime-macos-arm64.tar.gz -C web/src-tauri/runtime har-runtime-server
      - run: npm ci --prefix web
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content web/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          choco install innosetup --yes --no-progress
          npm run desktop:build --prefix web -- --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os != 'Windows'
        run: npm run desktop:build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            web/src-tauri/target/release/bundle/**/*.dmg
            web/src-tauri/target/release/bundle/**/*.exe
            web/src-tauri/target/release/bundle/**/*.app.zip
            web/src-tauri/runtime/har-runtime-*.tar.gz

  windows-runtime:
    name: Build Windows ${{ matrix.variant }} runtime
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            torch-index: https://download.pytorch.org/whl/cpu
          - variant: cuda
            torch-index: https://download.pytorch.org/whl/cu128
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: pwsh
        run: |
          python -m pip install --no-cache-dir torch --index-url ${{ matrix.torch-index }}
          python -m pip install --no-cache-dir -e ".[desktop]"
          python -c "import torch; print('PyTorch:', torch.__version__, 'CUDA:', torch.version.cuda)"
      - if: matrix.variant == 'cuda'
        shell: pwsh
        run: python -c "import torch; assert torch.version.cuda, 'CUDA-enabled PyTorch was not installed'"
      - shell: pwsh
        run: ./scripts/build-sidecar.ps1
      # Archives over 2 GiB (the CUDA runtime) are split into .001, .002, ... parts.
      - shell: pwsh
        run: python scripts/package-runtime.py web/src-tauri/runtime/har-runtime-server release/har-runtime-windows-x64-${{ matrix.variant }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-windows-${{ matrix.variant }}
          if-no-files-found: error
          compression-level: 0
          path: release/har-runtime-windows-x64-${{ matrix.variant }}.zip*

  publish:
    name: Publish release
    needs: [test, build, windows-runtime]
    # A manual run from a branch only builds; releases come from version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - run: find release-assets -type f -exec ls -lh {} +
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
