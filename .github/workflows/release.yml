name: Release desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e ".[desktop]"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip uninstall --yes torch
          python -m pip install --upgrade --force-reinstall torch --index-url https://download.pytorch.org/whl/cu128
          python -c "import torch; print('PyTorch:', torch.__version__); print('CUDA runtime:', torch.version.cuda); assert torch.version.cuda, 'CUDA-enabled PyTorch was not installed'"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-sidecar.ps1
      - if: runner.os != 'Windows'
        run: ./scripts/build-sidecar.sh
      - run: npm ci --prefix web
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          npm run desktop:build --prefix web -- --no-bundle
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.2.0 scripts/windows-installer.iss
      - if: runner.os != 'Windows'
        run: npm run desktop:build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            web/src-tauri/target/release/bundle/**/*.dmg
            web/src-tauri/target/release/bundle/**/*.exe
            web/src-tauri/target/release/bundle/**/*.app.zip

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**/*
