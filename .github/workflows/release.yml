name: Release desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e "./har[test]"
      - working-directory: har
        run: python -m pytest -q

  # Each installer carries the ~40 MB runtime (no PyTorch). Nothing else is published:
  # the app no longer downloads a runtime from GitHub Releases.
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Must match the Python minor version the app installs PyTorch for on first launch.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./har[desktop]"
      - if: runner.os != 'Windows'
        run: ./scripts/build-sidecar.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-sidecar.ps1
      - run: npm ci --prefix desktop
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          choco install innosetup --yes --no-progress
          npm run desktop:build --prefix desktop -- --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os != 'Windows'
        run: npm run desktop:build --prefix desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.exe

  publish:
    name: Publish release
    needs: [test, build]
    # A manual run from a branch only builds; releases come from version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - run: find release-assets -type f -exec ls -lh {} +
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
