name: Release desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e ".[desktop]"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-sidecar.ps1
      - if: runner.os != 'Windows'
        run: ./scripts/build-sidecar.sh
      - if: runner.os != 'Windows'
        run: tar -czf web/src-tauri/runtime/har-runtime-macos-arm64.tar.gz -C web/src-tauri/runtime har-runtime-server
      - run: npm ci --prefix web
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
           npm run desktop:build --prefix web -- --no-bundle
           & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.3.3 scripts/windows-installer.iss
      - if: runner.os != 'Windows'
        run: npm run desktop:build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            web/src-tauri/target/release/bundle/**/*.dmg
            web/src-tauri/target/release/bundle/**/*.exe
            web/src-tauri/target/release/bundle/**/*.app.zip
            web/src-tauri/runtime/har-runtime-*.tar.gz
            web/src-tauri/runtime/har-runtime-*.zip

  windows-cpu-runtime:
    name: Build Windows CPU runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[desktop]"
      - shell: pwsh
        run: ./scripts/build-sidecar.ps1
      - shell: pwsh
        run: Compress-Archive -Path web/src-tauri/runtime/har-runtime-server -DestinationPath web/src-tauri/runtime/har-runtime-windows-x64-cpu.zip
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-windows-cpu
          path: web/src-tauri/runtime/har-runtime-windows-x64-cpu.zip

  publish:
    name: Publish release
    needs: [build, windows-cpu-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**/*
