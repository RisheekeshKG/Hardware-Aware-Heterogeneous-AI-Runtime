name: release

# Push a tag like v1.2.0 to build both installers and publish a GitHub release.
# A manual run builds the installers as artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Installer · ${{ matrix.os }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Must match the Python version the app installs PyTorch for on first launch.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./har[desktop]"
      - run: npm ci
        working-directory: desktop

      # The runtime bundle (~40 MB, no PyTorch) plus the uv binary go inside the installer.
      - if: runner.os == 'macOS'
        run: |
          ./scripts/build-sidecar.sh
          npm run desktop:build --prefix desktop
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-sidecar.ps1
          npm run desktop:build --prefix desktop -- --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup --yes --no-progress
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.exe

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: installers/**/*
