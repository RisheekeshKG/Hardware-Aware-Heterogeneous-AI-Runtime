name: ci

# Runs on the two platforms HAR ships for. Python 3.12 is what the desktop app bundles.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs this before building installers

jobs:
  python:
    name: Python tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: har/pyproject.toml
      - run: python -m pip install -e "./har[test]"
      - run: python -m pytest -q
        working-directory: har

  desktop:
    name: Desktop app · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run lint
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Checks both the macOS and the Windows-only code paths in the Rust shell.
      - run: cargo check --locked
        working-directory: desktop/src-tauri
